<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FATYAK Audio Forge logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="55%" stop-color="#120a22"/>
      <stop offset="100%" stop-color="#08040f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="45%" stop-color="#ff3d6e"/>
      <stop offset="100%" stop-color="#7b2cff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="50%" stop-color="#ff2d6f"/>
      <stop offset="100%" stop-color="#a855ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#7b2cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- hex shield -->
  <path d="M256 44 L424 140 L424 372 L256 468 L88 372 L88 140 Z" fill="#0b0616" stroke="url(#ring)" stroke-width="10" stroke-linejoin="round" opacity="0.97"/>
  <path d="M256 78 L394 157 L394 355 L256 434 L118 355 L118 157 Z" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- F monogram -->
  <g stroke="url(#ring)" stroke-width="30" stroke-linecap="round" fill="none" filter="url(#soft)" opacity="0.55">
    <path d="M178 176 L178 352"/>
    <path d="M178 176 L318 176"/>
    <path d="M178 258 L286 258"/>
  </g>
  <g stroke="url(#ring)" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M178 176 L178 352"/>
    <path d="M178 176 L318 176"/>
    <path d="M178 258 L286 258"/>
  </g>

  <!-- equalizer bars -->
  <g fill="url(#bar)">
    <rect x="330" y="286" width="16" height="66" rx="8"/>
    <rect x="356" y="240" width="16" height="112" rx="8"/>
    <rect x="382" y="196" width="16" height="156" rx="8"/>
  </g>

  <!-- soundwave line -->
  <path d="M120 404 L170 404 L192 372 L216 436 L244 356 L272 420 L296 388 L318 404 L392 404"
        fill="none" stroke="url(#wave)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
</svg>
